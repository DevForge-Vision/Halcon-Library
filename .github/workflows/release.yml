name: Windows SDK Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check version and release notes
        run: |
          $source = Get-Content CMakeLists.txt -Raw
          if ($source -notmatch 'project\(GlimHalcon VERSION ([0-9]+\.[0-9]+\.[0-9]+)') { throw 'Missing version' }
          $version = $Matches[1]
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and CMake version differ' }
          if (!(Test-Path "docs/releases/$version.md")) { throw 'Missing release notes' }
      - name: Locate NSIS
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (!(Test-Path "$nsis/makensis.exe")) {
            choco install nsis --version=3.10 -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          if (!(Test-Path "$nsis/makensis.exe")) { throw 'NSIS not found' }
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.arch }} -T v143 -DGLIM_HALCON_BUILD_SHARED=ON -DGLIM_HALCON_ENABLE_PACKAGING=ON -DGLIM_HALCON_BUILD_MFC_DEMO=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Regression tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Package installer and ZIP
        run: |
          cpack --config build/CPackConfig.cmake -C Release -G "NSIS;ZIP" -B dist
          if ($LASTEXITCODE -ne 0) { throw 'CPack failed' }
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip' })
          if ($assets.Count -ne 2) { throw 'Expected one installer and one ZIP' }
          $lines = foreach ($asset in $assets) {
            "$((Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($asset.Name)"
          }
          $lines | Set-Content "dist/SHA256SUMS-${{ matrix.arch }}.txt" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: dist
          merge-multiple: true
      - name: Publish versioned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 6
          (cd dist && sha256sum -c SHA256SUMS-*.txt)
          # No clobber: never silently replace assets of an existing version.
          gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --latest=false \
            --title "GlimHalcon SDK $version" --notes-file "docs/releases/$version.md"

